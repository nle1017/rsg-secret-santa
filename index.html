<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSG Secret Santa</title>
<meta name="theme-color" content="#0c0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* surfaces (near-black, Code / NFA style) */
  --bg0:#000000; --bg1:#0c0b0c;
  --s1:#1c1a1c; --s2:#141214; --s3:#0b0b0c;
  --line:#2a2729; --line2:#3a3537;
  /* text */
  --text:#efeceb; --dim:#9d9799; --faint:#645e61;
  /* accents */
  --garnet:#a3233a; --garnet-hi:#c8475c; --garnet-deep:#5c0f1e; --rose:#d9677a;
  --pine:#2f8f5f; --pine-hi:#5fbf8a; --pine-deep:#1a5a3a; --mint:#86c9a0;
  --gold:#e8b45f; --gold-hi:#f6d08f; --gold-deep:#8a5a14;
  --snow:#eef3fa;
  /* shape */
  --cut:16px 3px 16px 3px; --cut-r:3px 14px 3px 14px;
  --cap:8px;
  --pixel:'Press Start 2P',monospace;
  --label:'Silkscreen',monospace;
  --body:system-ui,-apple-system,'Segoe UI Variable Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg0)}
html,body{margin:0;min-height:100%}
body{
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1000px 460px at 50% -12%,rgba(163,35,58,.30),transparent 70%),
    radial-gradient(700px 420px at 92% 4%,rgba(47,143,95,.13),transparent 70%),
    radial-gradient(600px 380px at 4% 18%,rgba(232,180,95,.07),transparent 70%),
    linear-gradient(180deg,var(--bg1),var(--bg0) 85%);
  background-attachment:fixed;
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
  background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%),
             repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
::selection{background:rgba(200,71,92,.45)}
#scene{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0}
#snow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
#app{position:relative;z-index:10;max-width:820px;margin:0 auto;padding:18px 16px 200px}

/* ---------- header ---------- */
header{text-align:center;padding:22px 0 6px}
[hidden]{display:none!important}
.logo{font-family:var(--pixel);font-size:clamp(17px,4.6vw,34px);line-height:1.45;letter-spacing:.03em;color:#efeceb;
  text-shadow:0 3px 0 #2a0710,0 0 18px rgba(163,35,58,.55);animation:logoIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.logo .nw{white-space:nowrap}
.logo .gift{display:inline-block;width:1.55em;height:1.55em;vertical-align:-.32em;margin-right:.5em;
  filter:drop-shadow(0 0 12px rgba(246,179,208,.55)) drop-shadow(0 3px 0 rgba(90,30,60,.6));animation:giftBob 3s ease-in-out infinite}
@keyframes giftBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.logo .r1{position:relative;display:inline-block}
.logo .hat2{position:absolute;width:1.4em;left:-.46em;top:-.66em;transform:rotate(-16deg);filter:drop-shadow(0 3px 2px rgba(0,0,0,.5));pointer-events:none}
header{padding-top:34px}
.logo .smart{color:#e0566d;text-shadow:0 3px 0 #2a0710,0 0 14px rgba(200,71,92,.8);animation:neon 6s steps(1) 2s infinite}
.logo .q{position:relative;display:inline-block;color:var(--gold);text-shadow:0 3px 0 #3a2508,0 0 14px rgba(232,180,95,.8);transform-origin:50% 90%;animation:wobble 3.2s ease-in-out infinite;margin-left:.04em}
@keyframes neon{0%,100%{opacity:1}91%{opacity:.55}92%{opacity:1}94%{opacity:.4}95%{opacity:1}}
@keyframes logoIn{from{opacity:0;transform:translateY(8px) scale(.97);letter-spacing:.2em}to{opacity:1;transform:none}}
@keyframes wobble{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-10deg) translateY(-3px)}}
.edition{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px auto 0;max-width:560px;
  font-family:var(--label);font-size:clamp(13px,2.6vw,17px);letter-spacing:.34em;color:var(--gold);text-shadow:0 0 16px rgba(232,180,95,.45);
  animation:logoIn 1.1s .25s cubic-bezier(.2,.8,.2,1) both}
.edition span{padding-left:.34em;white-space:nowrap}
.edition::before,.edition::after{content:'';flex:1;height:2px;min-width:20px;box-shadow:0 0 10px rgba(200,71,92,.6)}
.edition::before{background:linear-gradient(90deg,transparent,var(--garnet-hi))}
.edition::after{background:linear-gradient(90deg,var(--garnet-hi),transparent)}
.when{margin-top:8px;font-family:var(--label);font-size:12px;letter-spacing:.28em;color:#c9c2c4;animation:logoIn 1.1s .4s cubic-bezier(.2,.8,.2,1) both}
.hud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:16px}
.glass{background:rgba(22,20,22,.55);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px -12px rgba(0,0,0,.8)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:var(--cut-r);font-size:14px;color:var(--dim)}
.pill .lbl{font-family:var(--label);font-size:11px;letter-spacing:.18em;color:#bdb6b8}
.pill .cd{font-family:var(--label);font-size:15px;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 12px rgba(232,180,95,.4)}
.pill .cd i{font-style:normal;color:#d8d1d3;font-size:12px;margin:0 6px 0 2px;text-shadow:none}
@media(max-width:560px){.edition{letter-spacing:.22em;gap:10px}.when{letter-spacing:.2em}.pill .lbl{display:none}}
.pill b{color:var(--text)}
.linkbtn{background:none;border:0;color:var(--rose);font:inherit;cursor:pointer;padding:0;border-bottom:1px dashed rgba(217,103,122,.5)}
.iconbtn{width:36px;height:34px;border-radius:var(--cut-r);color:var(--text);cursor:pointer;display:grid;place-items:center;padding:0}
.iconbtn svg{width:16px;height:16px}
.iconbtn.lit{color:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 16px -4px rgba(232,180,95,.7);border-color:rgba(232,180,95,.4)}
.banner{margin:14px auto 0;max-width:520px;padding:8px 12px;border-radius:var(--cut);text-align:center;font-family:var(--label);font-size:12px;letter-spacing:.12em;color:var(--gold);
  background:rgba(232,180,95,.08);border:1px solid rgba(232,180,95,.35)}

/* ---------- panels ---------- */
.panel{position:relative;border-radius:var(--cut);padding:24px;margin:calc(var(--cap) + 40px) 0 20px;border:1px solid transparent;
  background:linear-gradient(180deg,#1d1a1d,#0b0b0c) padding-box,
             linear-gradient(155deg,rgba(200,71,92,.55),var(--line) 30%,var(--line) 70%,rgba(232,180,95,.30)) border-box;
  box-shadow:0 24px 50px -24px rgba(0,0,0,.95),0 0 40px -18px rgba(163,35,58,.35)}
.panel::after{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);pointer-events:none}
.snowcap{position:absolute;left:6px;width:calc(100% - 12px);top:calc(3px - (var(--cap) + 14px) * 1.0667);height:calc((var(--cap) + 14px) * 1.6);pointer-events:none;overflow:visible;z-index:1;
  filter:drop-shadow(0 0 8px rgba(225,235,250,.22));transition:height 1.2s cubic-bezier(.2,.8,.2,1),top 1.2s cubic-bezier(.2,.8,.2,1)}
.panel.gold{background:linear-gradient(180deg,#221d16,#0b0b0c) padding-box,
             linear-gradient(155deg,rgba(246,208,143,.85),rgba(138,90,20,.5) 40%,var(--line) 70%,rgba(200,71,92,.4)) border-box;
  box-shadow:0 24px 50px -24px rgba(0,0,0,.95),0 0 60px -20px rgba(232,180,95,.45)}
h2{font-family:var(--label);font-weight:400;font-size:14px;letter-spacing:.2em;color:var(--rose);margin:0 0 6px;display:flex;align-items:center;gap:10px}
h2::before{content:'';width:7px;height:7px;background:linear-gradient(135deg,var(--gold-hi),var(--gold));transform:rotate(45deg);box-shadow:0 0 10px rgba(232,180,95,.7);flex:none}
.center h2{justify-content:center}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.small{font-size:14px}
.center{text-align:center}
.narrow{max-width:460px;margin-left:auto;margin-right:auto}
.lead{color:var(--dim);margin:4px 0 18px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.row.center{justify-content:center}
.badge{display:inline-block;font-family:var(--label);font-size:12px;letter-spacing:.08em;padding:2px 9px;border-radius:var(--cut-r);color:#2a1a02;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 0 14px -2px rgba(232,180,95,.6)}
.screen-in{animation:screenIn .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;font-family:var(--label);font-size:14px;letter-spacing:.14em;color:#fff;cursor:pointer;
  padding:14px 22px;border-radius:var(--cut-r);border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,var(--garnet-hi),var(--garnet) 55%,#7a1629);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px var(--garnet-deep),0 10px 26px -10px rgba(200,71,92,.9);
  text-shadow:0 1px 0 rgba(0,0,0,.35);transition:transform .08s,filter .15s,box-shadow .15s}
.btn::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transition:left .5s}
.btn:hover{filter:brightness(1.08)}
.btn:hover::after{left:130%}
.btn:active{transform:translateY(2px) scale(.99)}
.btn.go{background:linear-gradient(180deg,var(--pine-hi),var(--pine) 55%,#1f6b45);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px var(--pine-deep),0 10px 26px -10px rgba(95,191,138,.9)}
.btn.ghost{color:var(--text);text-shadow:none;border:1px solid transparent;
  background:linear-gradient(180deg,#1f1c1f,#121012) padding-box,linear-gradient(160deg,var(--line2),#1a181a) border-box;box-shadow:0 8px 20px -12px rgba(0,0,0,.9)}
.btn.ghost:hover{background:linear-gradient(180deg,#262226,#151315) padding-box,linear-gradient(160deg,rgba(200,71,92,.7),var(--line2)) border-box}
.btn.small{font-size:12px;padding:10px 14px}
.btn.big{font-size:16px;padding:16px 30px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}

/* ---------- player cards ---------- */
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:6px}
@media(min-width:680px){.players{grid-template-columns:repeat(4,1fr)}}
.pcard{position:relative;padding:26px 10px 16px;text-align:center;color:var(--text);font:inherit;border-radius:var(--cut);border:1px solid transparent;
  background:linear-gradient(180deg,#1d1a1d,#0e0d0e) padding-box,linear-gradient(160deg,var(--line2),#161416) border-box;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}
button.pcard{cursor:pointer}
button.pcard:hover{transform:translateY(-4px);
  background:linear-gradient(180deg,#221e22,#0f0e0f) padding-box,linear-gradient(160deg,var(--pc),#161416 70%) border-box;
  box-shadow:0 16px 34px -16px var(--pc)}
.pcard.ready{background:linear-gradient(180deg,#152019,#0c0f0d) padding-box,linear-gradient(160deg,var(--pine-hi),rgba(47,143,95,.25) 70%) border-box;
  box-shadow:0 0 30px -10px rgba(95,191,138,.7)}
.pcard .you{position:absolute;top:8px;right:8px;font-family:var(--label);font-size:10px;letter-spacing:.12em;color:var(--gold);padding:1px 6px;border:1px solid rgba(232,180,95,.45);border-radius:var(--cut-r)}
.avatar{position:relative;width:62px;height:62px;margin:4px auto 14px;display:grid;place-items:center;border-radius:var(--cut);
  font-family:var(--pixel);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:linear-gradient(150deg,var(--pc),color-mix(in srgb,var(--pc) 40%,#0b0b0c));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -6px 12px rgba(0,0,0,.25),0 10px 24px -8px var(--pc)}
.avatar .hat{position:absolute;width:42px;top:-21px;right:-15px;transform:rotate(16deg);filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.pname{font-family:var(--label);font-size:15px;letter-spacing:.12em;margin-bottom:10px}
.st{display:inline-block;font-family:var(--label);font-size:11px;letter-spacing:.1em;padding:3px 9px;border-radius:var(--cut-r);color:var(--dim);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.st.ok{color:#d9f5e5;background:rgba(47,143,95,.25);border-color:rgba(95,191,138,.5)}
.st.mid{color:var(--gold-hi);background:rgba(232,180,95,.1);border-color:rgba(232,180,95,.35)}
.st.new{color:var(--rose);background:rgba(163,35,58,.12);border-color:rgba(200,71,92,.35)}
.online{font-size:12px;margin-top:8px;color:var(--faint);font-family:var(--label);letter-spacing:.1em}
.online i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#4a4547;vertical-align:1px}
.online.on{color:var(--mint)}
.online.on i{background:var(--mint);box-shadow:0 0 8px var(--mint);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.xpbox{margin-top:24px}
.xphead{display:flex;justify-content:space-between;font-family:var(--label);font-size:12px;letter-spacing:.16em;color:var(--dim);margin-bottom:8px}
.xphead b{color:var(--gold);font-weight:400}
.xp{position:relative;height:14px;border-radius:var(--cut-r);overflow:hidden;background:#0a090a;border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.xp>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;transition:width 1s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,var(--garnet),var(--garnet-hi) 50%,var(--gold));box-shadow:0 0 16px rgba(200,71,92,.7)}
.xp>i::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.35) 22px 24px)}
.xp.full>i{background:linear-gradient(90deg,var(--pine),var(--pine-hi),var(--gold));box-shadow:0 0 18px rgba(95,191,138,.8)}
.waiting{margin-top:12px;text-align:center;font-size:14px;color:var(--dim)}
.waiting b{color:var(--text);font-weight:600}

/* ---------- form ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.tile{position:relative;font:inherit;font-size:14.5px;text-align:left;padding:9px 34px 9px 9px;color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:center;line-height:1.2;
  border-radius:var(--cut-r);border:1px solid transparent;
  background:linear-gradient(180deg,#1b181b,#100f10) padding-box,linear-gradient(160deg,#302c2e,#191719) border-box;transition:transform .1s,background .15s,box-shadow .15s}
.tile:hover{background:linear-gradient(180deg,#221e22,#121012) padding-box,linear-gradient(160deg,#4a4346,#1d1a1d) border-box}
.tile:active{transform:scale(.98)}
.tile .ico{flex:none;width:32px;height:32px;display:grid;place-items:center;font-size:17px;border-radius:var(--cut-r);background:#0a090a;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.tile::after{content:'';position:absolute;right:10px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:1px solid #3a3537;transition:all .15s}
.tile.like.on{background:linear-gradient(180deg,#142219,#0c120e) padding-box,linear-gradient(160deg,var(--pine-hi),rgba(47,143,95,.3)) border-box;box-shadow:0 0 22px -10px rgba(95,191,138,.9)}
.tile.like.on .ico{background:linear-gradient(160deg,rgba(95,191,138,.35),rgba(26,90,58,.4))}
.tile.like.on::after{content:'✓';display:grid;place-items:center;font-size:11px;color:#06170e;border-color:transparent;background:var(--pine-hi);box-shadow:0 0 10px var(--pine-hi)}
.tile.nope.on{background:linear-gradient(180deg,#24121a,#120a0d) padding-box,linear-gradient(160deg,var(--garnet-hi),rgba(163,35,58,.3)) border-box;box-shadow:0 0 22px -10px rgba(200,71,92,.9)}
.tile.nope.on .ico{background:linear-gradient(160deg,rgba(200,71,92,.35),rgba(92,15,30,.5))}
.tile.nope.on::after{content:'✕';display:grid;place-items:center;font-size:10px;color:#fff;border-color:transparent;background:var(--garnet-hi);box-shadow:0 0 10px var(--garnet-hi)}
input,select,textarea{font:inherit;font-size:15.5px;color:var(--text);width:100%;padding:11px 13px;border-radius:var(--cut-r);border:1px solid var(--line);
  background:#0a090a;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#57514f}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--garnet-hi);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 3px rgba(200,71,92,.2)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label{display:block;margin-top:16px;font-family:var(--label);font-size:12px;letter-spacing:.14em;color:var(--dim)}
label input,label select,label textarea{margin-top:6px;font-family:var(--body);letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 2fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;margin-bottom:8px}
.item .x{border-radius:var(--cut-r);border:1px solid var(--line);background:#141214;color:var(--rose);font-size:15px;cursor:pointer}
.item .x:hover{border-color:var(--garnet-hi);background:#1f1216}
@media(max-width:560px){.item{grid-template-columns:1fr 40px}.item .it-link{grid-column:1;grid-row:2}.item .x{grid-row:1/3;grid-column:2}}
.pin{font-family:var(--pixel);font-size:26px;text-align:center;letter-spacing:16px;width:200px;display:block;margin:10px auto 14px;padding:14px 0 14px 16px;border-radius:var(--cut)}
.msg{min-height:24px;color:var(--rose);font-family:var(--label);font-size:13px;letter-spacing:.1em}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sep{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:22px 0}

/* ---------- wheel ---------- */
.stage{position:relative;width:min(420px,86vw);aspect-ratio:1;margin:22px auto 6px}
.stage::before{content:'';position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(circle,rgba(200,71,92,.28),rgba(232,180,95,.08) 45%,transparent 68%);filter:blur(10px)}
.stage canvas{position:relative;width:100%;height:100%;display:block}
.pointer{position:absolute;top:-22px;left:50%;width:46px;margin-left:-23px;z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(232,180,95,.5));transform-origin:50% 30%}
.pointer.kick{animation:kick .12s ease-out}
@keyframes kick{50%{transform:rotate(-14deg)}}
.cdown{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pixel);font-size:76px;color:#fff;pointer-events:none;z-index:3;
  text-shadow:0 4px 0 var(--garnet-deep),0 0 30px rgba(200,71,92,.9)}
.cdown span{animation:pop .85s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.7);opacity:0}}
.spinmsg{margin-top:10px;font-family:var(--label);letter-spacing:.2em;color:var(--dim)}

/* ---------- result ---------- */
.achv{display:flex;gap:18px;align-items:center;padding:16px 20px;border-radius:var(--cut);border:1px solid transparent;
  background:linear-gradient(90deg,#2e2416,#171416 60%) padding-box,linear-gradient(120deg,var(--gold-hi),rgba(138,90,20,.5) 50%,#2a2729) border-box;
  animation:achvIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes achvIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}

<script type="module">
/* ============ SETTINGS (edit these) ============ */

/* =============================================== */

const CATS = [
  ['games','🎮','Video games & gift cards'],

const PALETTE = ['#d9677a', '#f29cc3', '#5fbf8a', '#6aa8d9', '#e8b45f', '#a48be0'];
const COLOR = Object.fromEntries(IDS.map((id, i) => [id, PALETTE[i % PALETTE.length]]));

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store = {
  get(k){ try { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },

};

const S = { me:null, priv:null, players:{}, game:{status:'lobby'}, screen:'loading', leave:null, drawing:false, moving:false, giftee:null, loaded:{p:false,g:false} };

/* ============ DATABASE ============ */
async function firebaseDB(cfg){
  const V = '11.0.2';
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const d = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const db = d.getDatabase(initializeApp(cfg));
  const r = p => d.ref(db, p);
  return {
    sub(path, cb){ return d.onValue(r(path), s => cb(s.val())); },
    set(path, v){ return d.set(r(path), v); },
    update(path, v){ return d.update(r(path), v); },
    async get(path){ return (await d.get(r(path))).val(); },
    async txn(path, fn){ const res = await d.runTransaction(r(path), fn); return { committed: res.committed }; },
    presence(path){
      const ref = r(path);
      const off = d.onValue(r('.info/connected'), s => {
        if (s.val() === true) d.onDisconnect(ref).set(false).then(() => d.set(ref, true));
      });
      return () => { off(); d.onDisconnect(ref).cancel(); d.set(ref, false); };
    },
  };
}
function mockDB(){
  const KEY = 'rsg-mock-db';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const subs = new Set();
  const getAt = (o, path) => path.split('/').filter(Boolean).reduce((a, k) => a == null ? null : (a[k] ?? null), o);
  const setAt = (o, path, v) => {
    const ks = path.split('/').filter(Boolean); let a = o;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof a[ks[i]] !== 'object' || a[ks[i]] === null) a[ks[i]] = {}; a = a[ks[i]]; }
    if (v === null || v === undefined) delete a[ks.at(-1)]; else a[ks.at(-1)] = JSON.parse(JSON.stringify(v));
  };
  const notify = () => { const o = load(); subs.forEach(s => { const v = JSON.stringify(getAt(o, s.path)); if (v !== s.last) { s.last = v; s.cb(JSON.parse(v)); } }); };
  const save = o => { localStorage.setItem(KEY, JSON.stringify(o)); notify(); };
  addEventListener('storage', e => { if (e.key === KEY) notify(); });
  const api = {
    sub(path, cb){ const s = { path, cb, last: undefined }; subs.add(s); setTimeout(notify, 0); return () => subs.delete(s); },
    async set(path, v){ const o = load(); setAt(o, path, v); save(o); },
    async update(path, obj){ const o = load(); for (const [k, v] of Object.entries(obj)) setAt(o, `${path}/${k}`, v); save(o); },
    async get(path){ return getAt(load(), path); },
    async txn(path, fn){ const o = load(); const res = fn(getAt(o, path)); if (res === undefined) return { committed:false }; setAt(o, path, res); save(o); return { committed:true }; },
    presence(path){
      api.set(path, true);
      const bye = () => { const o = load(); setAt(o, path, false); localStorage.setItem(KEY, JSON.stringify(o)); };
      addEventListener('pagehide', bye);
      return () => { removeEventListener('pagehide', bye); api.set(path, false); };
    },
  };
  return api;
}

/* ============ CRYPTO (draws are locked to each player's PIN) ============ */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => { let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const RSA = { name:'RSA-OAEP', hash:'SHA-256' };
async function pinKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function createIdentity(pin){
  const kp = await crypto.subtle.generateKey({ ...RSA, modulusLength:2048, publicExponent:new Uint8Array([1,0,1]) }, true, ['encrypt','decrypt']);
  const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
  const priv = await crypto.subtle.exportKey('pkcs8', kp.privateKey);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const wrapped = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await pinKey(pin, salt), priv);
  return { record:{ pub:JSON.stringify(pub), salt:b64(salt), iv:b64(iv), key:b64(wrapped) }, privateKey:kp.privateKey };
}
async function unlock(rec, pin){
  const raw = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(rec.iv) }, await pinKey(pin, unb64(rec.salt)), unb64(rec.key));
  return crypto.subtle.importKey('pkcs8', raw, RSA, false, ['decrypt']);
}
async function sealFor(rec, text){
  const pub = await crypto.subtle.importKey('jwk', JSON.parse(rec.pub), RSA, false, ['encrypt']);
  return b64(await crypto.subtle.encrypt({ name:'RSA-OAEP' }, pub, enc.encode(text)));
}
async function openSealed(priv, c){ return dec.decode(await crypto.subtle.decrypt({ name:'RSA-OAEP' }, priv, unb64(c))); }
function randInt(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function derange(ids){
  while (true) {
    const p = ids.slice();
    for (let i = p.length - 1; i > 0; i--) { const j = randInt(i + 1); [p[i], p[j]] = [p[j], p[i]]; }
    if (p.every((x, i) => x !== ids[i])) return p;
  }
}

/* ============ SOUND ============ */
let AC = null, muted = store.get('rsg-muted') === true;
function ac(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, dur, type = 'square', vol = .05, when = 0){
  if (muted) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  } catch {}
}
const sfx = {
  tick: () => tone(1500, .025, 'square', .03),
  blip: () => tone(720, .06, 'triangle', .06),
  beep: hi => tone(hi ? 988 : 494, .18, 'square', .045),
  err: () => { tone(220, .12, 'sawtooth', .04); tone(160, .18, 'sawtooth', .04, .1); },
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'square', .04, i * .09)),
  join: () => [392, 523, 659].forEach((f, i) => tone(f, .12, 'triangle', .07, i * .07)),
};
/* ---------- chill lo-fi Christmas loop (Jingle Bells, public domain, + an original bridge) ---------- */
const music = { on: store.get('rsg-music') !== false, playing: false, timer: null, bus: null, next: 0, step: 0, duck: 1 };
const BPM = 82, BEAT = 60 / BPM;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// melody: [midi or 0 for rest, beats]
const MEL = [
  [76,1],[76,1],[76,2], [76,1],[76,1],[76,2], [76,1],[79,1],[72,1.5],[74,.5], [76,4],
  [77,1],[77,1],[77,1.5],[77,.5], [77,1],[76,1],[76,1],[76,.5],[76,.5], [76,1],[74,1],[74,1],[76,1], [74,2],[79,2],
  [76,1],[76,1],[76,2], [76,1],[76,1],[76,2], [76,1],[79,1],[72,1.5],[74,.5], [76,4],
  [77,1],[77,1],[77,1.5],[77,.5], [77,1],[76,1],[76,1],[76,.5],[76,.5], [79,1],[79,1],[77,1],[74,1], [72,4],
  [0,32],
];
const CH = { // chord voicings (midi)
  C: [48, 64, 67, 71, 74], Am: [45, 64, 67, 72, 76], F: [41, 64, 69, 72, 76], Dm: [50, 65, 69, 72, 76],
  G: [43, 65, 69, 71, 74], Em: [40, 62, 67, 71, 74], C6: [48, 64, 67, 69, 74], Gs: [43, 65, 67, 72, 74],
};
const BARS = ['C','Am','C','C6','F','C','Dm','G','C','Am','C','C6','F','C','G','C',  'F','Em','Dm','C','F','Em','Dm','Gs'];
let noiseBuf = null;
function musicBus(){
  const a = ac();
  if (music.bus) return music.bus;
  const out = a.createGain(); out.gain.value = 0;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = .4;
  const dly = a.createDelay(1); dly.delayTime.value = BEAT * .75;
  const fb = a.createGain(); fb.gain.value = .28;
  const wet = a.createGain(); wet.gain.value = .22;
  const dlp = a.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 1800;
  lp.connect(out); lp.connect(dly); dly.connect(dlp); dlp.connect(fb); fb.connect(dly); dlp.connect(wet); wet.connect(out);
  out.connect(a.destination);
  noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  music.bus = { out, in: lp };
  return music.bus;
}
function mNote(t, m, dur, kind){
  const a = ac(), bus = music.bus.in;
  const g = a.createGain(); g.connect(bus);
  const o = a.createOscillator(), f = mtof(m);
  if (kind === 'lead') {
    o.type = 'triangle'; o.frequency.value = f;
    const vib = a.createOscillator(), vg = a.createGain(); vib.frequency.value = 5; vg.gain.value = f * .004; vib.connect(vg).connect(o.frequency);
    vib.start(t); vib.stop(t + dur + .6);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.13, t + .03); g.gain.exponentialRampToValueAtTime(.06, t + dur * .8); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .5);
  } else if (kind === 'keys') {
    o.type = 'sine'; o.frequency.value = f;
    const o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.001; const g2 = a.createGain(); g2.gain.value = .25; o2.connect(g2).connect(g);
    o2.start(t); o2.stop(t + dur + .1);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.045, t + .01); g.gain.exponentialRampToValueAtTime(.012, t + dur * .7); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  } else { // bass
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  }
  o.connect(g); o.start(t); o.stop(t + dur + .6);
}
function mNoise(t, dur, freq, type, vol){
  const a = ac(), s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = .8;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(music.bus.in); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
function mKick(t){
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(42, t + .18);
  g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
  o.connect(g).connect(music.bus.in); o.start(t); o.stop(t + .32);
}
const TOTAL_BEATS = BARS.length * 4;
const melStarts = (() => { let b = 0; return MEL.map(([m, d]) => { const s = b; b += d; return [s, m, d]; }); })();
function scheduleBeat(beat, t){
  const bar = Math.floor(beat / 4), inBar = beat % 4, ch = CH[BARS[bar]];
  const sw = BEAT * .5 * 1.16;               // lazy swing on the off-beat
  // drums: soft kick, brushed snare, sleigh bells
  if (inBar === 0 || (inBar === 2 && bar % 2)) mKick(t);
  if (inBar === 1 || inBar === 3) mNoise(t, .18, 2200, 'bandpass', .05);
  mNoise(t, .07, 7500, 'highpass', .028); mNoise(t + sw, .05, 8000, 'highpass', .018);
  // bass
  if (inBar === 0) mNote(t, ch[0], BEAT * 1.8, 'bass');
  if (inBar === 2) mNote(t, ch[0] + 7, BEAT * 1.5, 'bass');
  // keys: chord on 1, a lazy re-hit on the "and" of 2, arpeggio in the bridge
  if (inBar === 0) ch.slice(1).forEach((m, i) => mNote(t + i * .018, m, BEAT * 1.6, 'keys'));
  if (inBar === 1) ch.slice(2).forEach((m, i) => mNote(t + sw + i * .02, m, BEAT * 1.4, 'keys'));
  if (bar >= 16) { const arp = ch.slice(1); mNote(t, arp[(beat * 2) % arp.length] + 12, BEAT * .9, 'keys'); mNote(t + sw, arp[(beat * 2 + 1) % arp.length] + 12, BEAT * .7, 'keys'); }
  // melody notes starting inside this beat
  for (const [s, m, d] of melStarts) if (m && s >= beat && s < beat + 1) mNote(t + (s - beat) * BEAT + (Math.random() - .5) * .012, m, d * BEAT * .92, 'lead');
  // vinyl crackle
  if (Math.random() < .5) mNoise(t + Math.random() * BEAT, .012, 3000, 'highpass', .02 + Math.random() * .03);
}
function musicStart(){
  if (music.playing || muted === undefined) return;
  try {
    const a = ac(); musicBus();
    music.playing = true; music.next = a.currentTime + .15; music.step = 0;
    music.bus.out.gain.cancelScheduledValues(a.currentTime);
    music.bus.out.gain.setValueAtTime(music.bus.out.gain.value, a.currentTime);
    music.bus.out.gain.linearRampToValueAtTime(.9 * music.duck, a.currentTime + 2.5);
    music.timer = setInterval(() => {
      while (music.next < a.currentTime + .35) { scheduleBeat(music.step % TOTAL_BEATS, music.next); music.next += BEAT; music.step++; }
    }, 60);

function drawWheel(c, segs){

    { a:'#c8475c', b:'#7a1629', ink:'#ffffff' },   // garnet
    { a:'#f7efe2', b:'#d8c8ae', ink:'#8f1c32' },   // cream

  for (let i = 0; i < NB; i++) {

    const warm = i % 2 === 0;
    x.save(); x.shadowColor = warm ? 'rgba(246,208,143,.95)' : 'rgba(217,103,122,.95)'; x.shadowBlur = 14;
    const bg = x.createRadialGradient(bx - 2, by - 2, 1, bx, by, 7);
    bg.addColorStop(0, '#ffffff'); bg.addColorStop(.5, warm ? '#f6d08f' : '#ef8a9b'); bg.addColorStop(1, warm ? '#a8761f' : '#8f1c32');
    x.fillStyle = bg; x.beginPath(); x.arc(bx, by, 6.5, 0, 7); x.fill(); x.restore();
  }
  // segments
  segs.forEach((id, i) => {
    const a0 = -Math.PI / 2 + i * a, sk = SKINS[i % SKINS.length];

    x.font = '30px "Silkscreen"'; x.textAlign = 'right'; x.textBaseline = 'middle';
    if (sk.ink === '#ffffff') { x.fillStyle = 'rgba(0,0,0,.35)'; x.fillText(NAME[id].toUpperCase(), R - 30 + 2, 3); }

    x.restore();
  });
  // dividers
  g = x.createRadialGradient(cx, cx, 60, cx, cx, R); g.addColorStop(0, '#8a5a14'); g.addColorStop(1, '#f6d08f');
  x.strokeStyle = g; x.lineWidth = 3;
  segs.forEach((_, i) => { const t = -Math.PI / 2 + i * a; x.beginPath(); x.moveTo(cx + Math.cos(t) * 70, cx + Math.sin(t) * 70); x.lineTo(cx + Math.cos(t) * R, cx + Math.sin(t) * R); x.stroke(); });

  x.beginPath(); x.arc(cx, cx, R, 0, 7); x.fillStyle = g; x.fill();

function spinTo(c, total, dur, seg){
  return new Promise(res => {
    const t0 = performance.now(); let last = 0; const ptr = $('#pointer');
    const ease = t => 1 - Math.pow(1 - t, 4);
    const f = now => {
      const t = Math.min(1, (now - t0) / dur), ang = total * ease(t);
      c.style.transform = `rotate(${ang}deg)`;
      const tk = Math.floor(ang / seg);
      if (tk !== last) { last = tk; sfx.tick(); if (ptr) { ptr.classList.remove('kick'); void ptr.offsetWidth; ptr.classList.add('kick'); } }
      t < 1 ? requestAnimationFrame(f) : res();
    };
    requestAnimationFrame(f);
  });
}

/* ============ SNOW CAPS on each box (smooth SVG drifts + icicles) ============ */
function snowcapSVG(seed){
  const r = rng(seed * 7919 + 17), B = 40;            // B = bottom of the snow body in viewBox units (box edge)
  const pts = [[0, B], [10, B - 14 - r() * 6]];
  let x = 10;
  while (x < 975) { x += 45 + r() * 70; pts.push([Math.min(x, 985), 2 + r() * 14 + (r() < .25 ? 7 : 0)]); }
  pts.push([992, B - 14 - r() * 6], [1000, B]);
  // Catmull-Rom through the points -> smooth top edge
  let top = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    top += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1].toFixed(1)}`;
  }
  // a wavy underside that hangs a little over the edge
  let under = '';
  for (let ux = 1000; ux > 0; ux -= 25) under += ` Q${ux - 12.5},${B + 3 + r() * 3} ${ux - 25},${B + 1}`;
  const body = `${top}${under} Z`;
  let icicles = '';
  const n = 5 + Math.floor(r() * 5);
  for (let i = 0; i < n; i++) {
    const ix = 40 + r() * 920, w = 5 + r() * 6, len = 8 + r() * 12;
    icicles += `<path d="M${(ix - w / 2).toFixed(1)},${B + 1} Q${ix.toFixed(1)},${(B + 3).toFixed(1)} ${(ix + w / 2).toFixed(1)},${B + 1} L${(ix + .6).toFixed(1)},${(B + len).toFixed(1)} Z" fill="url(#ic${seed})"/>`;
  }
  let sparkles = '';
  for (let i = 0; i < 14; i++) {
    const sx = 20 + r() * 960, sy = 10 + r() * 22;
    sparkles += `<rect x="${sx.toFixed(1)}" y="${sy.toFixed(1)}" width="2.2" height="1.4" fill="#fff" opacity="${(.35 + r() * .6).toFixed(2)}"><animate attributeName="opacity" values="0;1;0" dur="${(2.5 + r() * 4).toFixed(1)}s" begin="${(r() * 4).toFixed(1)}s" repeatCount="indefinite"/></rect>`;
  }
  return `<svg class="snowcap" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="sb${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef3fa"/><stop offset=".85" stop-color="#d3deec"/><stop offset="1" stop-color="#aebdd2"/></linearGradient>
      <linearGradient id="ic${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fd"/><stop offset="1" stop-color="#cfe0f5" stop-opacity=".15"/></linearGradient>
      <linearGradient id="sh${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f93ad" stop-opacity="0"/><stop offset="1" stop-color="#7f93ad" stop-opacity=".55"/></linearGradient>
    </defs>
    <path d="${body}" fill="url(#sh${seed})" transform="translate(0,2.5)"/>
    ${icicles}
    <path d="${body}" fill="url(#sb${seed})"/>
    <path d="${top}" fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".95" vector-effect="non-scaling-stroke"/>
    ${sparkles}
  </svg>`;
}
let capSeed = 0;
function decorateCaps(){

    if (p.querySelector(':scope > .snowcap')) return;

/* ============ SCENERY (stars, hills, pine trees) ============ */
function rng(seed){ return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function drawScene(){
  const c = $('#scene'), x = c.getContext('2d');
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const r = rng(1225);
  x.clearRect(0, 0, W, H);
  for (let i = 0; i < Math.floor(W * H / 9000); i++) {
    const sx = r() * W, sy = r() * H * .7, s = r();
    x.fillStyle = `rgba(239,236,235,${.08 + s * .35})`; x.fillRect(sx, sy, s > .9 ? 2 : 1, s > .9 ? 2 : 1);
  }
  const hill = (base, amp, col) => {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, H);
    for (let i = 0; i <= W + 20; i += 20) x.lineTo(i, H - base - Math.sin(i / 170 + base) * amp - Math.sin(i / 61) * amp * .35);
    x.lineTo(W, H); x.closePath(); x.fill();
  };
  hill(120, 22, 'rgba(24,20,24,.9)');
  const tree = (tx, by, th, body, frost) => {
    const tw = th * .52;
    x.fillStyle = body; x.fillRect(tx - th * .03, by - th * .08, th * .06, th * .1);
    for (let t = 0; t < 3; t++) {
      const w = tw * (1 - t * .24), bot = by - th * .08 - th * t * .24, top = bot - th * .42;
      x.fillStyle = body; x.beginPath(); x.moveTo(tx, top); x.lineTo(tx - w / 2, bot); x.lineTo(tx + w / 2, bot); x.closePath(); x.fill();
      x.fillStyle = frost; x.beginPath(); x.moveTo(tx, top); x.lineTo(tx - w * .17, top + (bot - top) * .32); x.lineTo(tx + w * .17, top + (bot - top) * .32); x.closePath(); x.fill();
    }
  };
  const row = (count, base, minH, maxH, body, frost) => {
    for (let k = 0; k < count; k++) tree((k + .15 + r() * .7) / count * W, H - base + r() * 10, minH + r() * (maxH - minH), body, frost);
  };
  row(Math.ceil(W / 55), 92, 46, 86, '#141114', 'rgba(238,243,250,.16)');
  hill(60, 14, 'rgba(14,12,14,.95)');
  row(Math.ceil(W / 95), 38, 80, 150, '#090809', 'rgba(238,243,250,.42)');
}

/* ============ SNOW (piles up as players get ready) ============ */
const snow = { c: $('#snow'), flakes: [], parts: [], h: null, cw: 6, max: 34, target: 34 };
const sx = snow.c.getContext('2d');
function snowResize(){
  snow.c.width = innerWidth; snow.c.height = innerHeight;
  const cols = Math.ceil(innerWidth / snow.cw) + 2;
  const old = snow.h;
  snow.h = new Float32Array(cols);
  for (let i = 0; i < cols; i++) snow.h[i] = old && old[i] != null ? old[i] : 12 + Math.sin(i / 11) * 5 + Math.sin(i / 4.3) * 2;
  const want = Math.min(200, Math.floor(innerWidth / 6));
  while (snow.flakes.length < want) snow.flakes.push(newFlake(true));
  snow.flakes.length = want;
  drawScene();
}
function newFlake(anywhere){
  const z = Math.random();
  return { x: Math.random() * innerWidth, y: anywhere ? Math.random() * innerHeight : -6, r: .6 + z * 2.2, a: .25 + z * .6,
    vy: .35 + z * 1.1, ph: Math.random() * 6.28, sw: .2 + Math.random() * .6 };
}
function updateSnowLevel(){
  const n = readyCount(), done = IDS.filter(id => S.players[id]?.formDone).length;
  snow.target = 30 + done * 10 + n * 22 + (S.game?.status === 'drawn' ? 30 : 0);
  document.documentElement.style.setProperty('--cap', `${8 + done * 1 + n * 1.5}px`);
}
function burst(x, y){
  const cols = ['#c8475c', '#e8b45f', '#f6d08f', '#ffffff', '#5fbf8a', '#ef8a9b'];
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * 6.28, v = 3 + Math.random() * 8;
    snow.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, life: 100 + Math.random() * 70, c: cols[i % cols.length], s: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3 });
  }
}
function snowFrame(t){
  const W = snow.c.width, H = snow.c.height, h = snow.h, cw = snow.cw;
  snow.max += (snow.target - snow.max) * .01;
  sx.clearRect(0, 0, W, H);
  for (const f of snow.flakes) {
    f.y += f.vy; f.x += Math.sin(t / 1100 + f.ph) * f.sw;
    if (f.x < 0) f.x += W; if (f.x > W) f.x -= W;
    const ci = Math.max(0, Math.min(h.length - 1, Math.round(f.x / cw)));
    if (f.y >= H - h[ci]) {
      if (h[ci] < snow.max) h[ci] += f.r * .55;
      Object.assign(f, newFlake(false));
      continue;
    }
    sx.globalAlpha = f.a; sx.fillStyle = '#ffffff';
    sx.beginPath(); sx.arc(f.x, f.y, f.r, 0, 6.283); sx.fill();
  }
  sx.globalAlpha = 1;
  for (let i = 1; i < h.length - 1; i++) {
    h[i] += (h[i - 1] + h[i + 1] - 2 * h[i]) * .04;
    if (h[i] > snow.max + 2) h[i] -= .25;
  }
  // smooth drift
  const top = H - snow.max - 10;
  const g = sx.createLinearGradient(0, top, 0, H); g.addColorStop(0, '#ffffff'); g.addColorStop(.35, '#e9eef6'); g.addColorStop(1, '#9fb0c6');
  sx.beginPath(); sx.moveTo(0, H); sx.lineTo(0, H - h[0]);
  for (let i = 1; i < h.length; i++) {
    const x0 = (i - 1) * cw, x1 = i * cw;
    sx.quadraticCurveTo(x0, H - h[i - 1], (x0 + x1) / 2, H - (h[i - 1] + h[i]) / 2);
  }
  sx.lineTo(W, H); sx.closePath();
  sx.save(); sx.shadowColor = 'rgba(200,215,235,.35)'; sx.shadowBlur = 18; sx.fillStyle = g; sx.fill(); sx.restore();
  elves.acc += ELF_SPEED; while (elves.acc >= 1) { elves.acc -= 1; updateElves(); }
  drawElves();
  // sparkle on the drift
  if (Math.random() < .25) { const i = Math.floor(Math.random() * h.length); snow.parts.push({ x: i * cw, y: H - h[i] + 3, vx: 0, vy: 0, life: 18, c: '#ffffff', s: 2, rot: 0, vr: 0, spark: true }); }
  for (let i = snow.parts.length - 1; i >= 0; i--) {
    const p = snow.parts[i];
    if (!p.spark) { p.x += p.vx; p.y += p.vy; p.vy += .18; p.vx *= .99; p.rot += p.vr; }
    p.life--;
    if (p.life <= 0 || p.y > H) { snow.parts.splice(i, 1); continue; }
    sx.save(); sx.globalAlpha = p.spark ? p.life / 18 : Math.min(1, p.life / 40); sx.fillStyle = p.c;
    sx.translate(p.x, p.y); sx.rotate(p.rot); sx.fillRect(-p.s / 2, -p.s / 2, p.s, p.spark ? p.s : p.s * .6); sx.restore();
  }
  requestAnimationFrame(snowFrame);
}
/* ============ ELF BRAWL (pixel elves fighting on the snow) ============ */

const elves = { list: [], balls: [], pops: [], acc: 0 };

function ground(x){ const h = snow.h, i = Math.max(0, Math.min(h.length - 1, Math.round(x / snow.cw))); return snow.c.height - h[i] + 3; }
function popText(x, y, text, col){ elves.pops.push({ x, y, text, col: col || pick(POPCOL), life: 55, rot: (Math.random() - .5) * .4 }); }
function puff(x, y, n = 10){ for (let i = 0; i < n; i++) snow.parts.push({ x, y, vx: (Math.random() - .5) * 4, vy: -Math.random() * 3, life: 25 + Math.random() * 20, c: '#ffffff', s: 2 + Math.random() * 2, rot: 0, vr: 0 }); }
function dent(x){ const i = Math.round(x / snow.cw); for (let k = -3; k <= 3; k++) { const j = i + k; if (snow.h[j] != null) snow.h[j] = Math.max(6, snow.h[j] - (4 - Math.abs(k)) * 1.3); } }
function launch(e, dir, vx, vy){ e.state = 'fly'; e.vx = dir * vx; e.vy = -vy; e.spin = dir * (.15 + Math.random() * .3); e.t = 0; e.target = null; }
function updateElves(){
  const L = elves.list, W = snow.c.width;
  while (L.length < elfCount()) L.push(makeElf(L.length >= 3));
  if (L.length > elfCount()) L.length = elfCount();
  for (const e of L) {
    e.t++;
    if (e.state === 'fly') {
      e.vy += .32; e.x += e.vx; e.y += e.vy; e.rot += e.spin;
      const g = ground(e.x);
      if (e.y >= g && e.vy > 0) {
        if (e.vy > 5) { e.y = g; e.vy *= -.4; e.vx *= .6; puff(e.x, g, 6); }
        else { e.y = g; e.state = 'dazed'; e.t = 0; e.rot = 0; e.vx = 0; puff(e.x, g, 9); dent(e.x); }
      }
      if (e.x < -50 || e.x > W + 50) Object.assign(e, makeElf(true));
      continue;
    }
    e.y = ground(e.x);
    if (e.state === 'dazed') { if (e.t > 80 + (e.x % 60)) { e.state = 'walk'; e.t = 0; } continue; }
    if (!e.target || e.target.state === 'fly' || !L.includes(e.target) || Math.random() < .003) {
      const foes = L.filter(o => o !== e && o.state !== 'fly' && (o.team !== e.team || Math.random() < .12));   // sometimes betray your own team
      e.target = foes.length ? pick(foes) : null;
    }
    const tg = e.target;
    if (e.state === 'walk') {
      if (!tg) { e.x += e.dir * e.speed * .5; if (e.x < 10 || e.x > W - 10) e.dir *= -1; e.step += .15; continue; }
      const dx = tg.x - e.x; e.dir = dx > 0 ? 1 : -1;
      if (Math.abs(dx) < 8 * e.p + 4) { e.state = 'fight'; e.t = 0; e.fightFor = 50 + Math.random() * 120; }
      else {
        e.x += e.dir * e.speed * (Math.abs(dx) > 220 ? 1.7 : 1); e.step += .22 * e.speed;
        if (--e.cool <= 0 && Math.abs(dx) > 70 && Math.abs(dx) < 460) { e.state = 'throw'; e.t = 0; e.cool = 140 + Math.random() * 280; }
      }
    } else if (e.state === 'throw') {
      if (e.t === 14 && tg) {
        const dx = tg.x - e.x, T = 36 + Math.abs(dx) / 7, sy = e.y - 12 * e.p, ty = tg.y - 8 * tg.p;
        elves.balls.push({ x: e.x + e.dir * 5 * e.p, y: sy, vx: dx / T, vy: (ty - sy - .16 * T * T) / T, owner: e, life: 300 });
      }
      if (e.t > 26) { e.state = 'walk'; e.t = 0; }
    } else if (e.state === 'fight') {
      if (!tg || tg.state === 'fly' || Math.abs(tg.x - e.x) > 44) { e.state = 'walk'; e.t = 0; continue; }
      e.dir = tg.x > e.x ? 1 : -1;
      if (e.t % 14 === 7) {
        tg.x += e.dir * 2;
        const r = Math.random();
        if (r < .26) { launch(tg, e.dir, 2.5 + Math.random() * 5, 5 + Math.random() * 6 + (e.p === 3 ? 3 : 0)); popText(tg.x, tg.y - 22 * tg.p, pick(WORDS)); }
        else if (r < .4) popText((e.x + tg.x) / 2, e.y - 20 * e.p, pick(['BAP', 'BIF', 'pap', 'oof']), '#efeceb');
      }
      if (e.t > e.fightFor) { e.state = 'walk'; e.t = 0; }
    }
  }
  for (let i = elves.balls.length - 1; i >= 0; i--) {
    const b = elves.balls[i];
    b.vy += .32; b.x += b.vx; b.y += b.vy; b.life--;
    let hit = false;
    for (const e of L) {
      if (e === b.owner || e.state === 'fly') continue;
      if (Math.abs(e.x - b.x) < 4 * e.p + 3 && b.y > e.y - 18 * e.p && b.y < e.y) {
        launch(e, Math.sign(b.vx) || 1, 2 + Math.random() * 3, 3 + Math.random() * 4); popText(e.x, e.y - 22 * e.p, 'SPLAT!', '#eef3fa'); hit = true; break;
      }
    }
    const g = ground(b.x);
    if (hit || b.y > g || b.life <= 0) { puff(b.x, Math.min(b.y, g), 7); elves.balls.splice(i, 1); }
  }
  if (Math.random() < .0025) {
    const e = pick(L);
    if (e && e.state !== 'fly') { e.state = 'fly'; e.vx = (Math.random() - .5) * 3; e.vy = -7 - Math.random() * 3; e.spin = (Math.random() - .5) * .5; e.target = null; popText(e.x, e.y - 22 * e.p, pick(['WHEEE', 'YOLO', 'CANNONBALL']), '#f6d08f'); }
  }
  for (let i = elves.pops.length - 1; i >= 0; i--) { const p = elves.pops[i]; p.y -= .5; if (--p.life <= 0) elves.pops.splice(i, 1); }
}
function drawElf(e){
  const x = sx, T = TEAMS[e.team], p = e.p;
  const R = (c, px, py, w = 1, h = 1) => { x.fillStyle = c; x.fillRect(px, py, w, h); };
  x.save();
  x.translate(Math.round(e.x), Math.round(e.y));
  if (e.state === 'fly') { x.translate(0, -9 * p); x.rotate(e.rot); x.translate(0, 9 * p); }
  x.scale(e.dir * p, p);
  const f = e.state === 'walk' ? Math.floor(e.step) % 2 : 0;
  const punching = e.state === 'fight' && e.t % 14 > 3 && e.t % 14 < 10;
  const winding = e.state === 'throw' && e.t < 14;
  // shadow
  if (e.state !== 'fly') { x.fillStyle = 'rgba(80,100,130,.35)'; x.fillRect(-4, -1, 8, 1); }
  // legs (striped stockings) + curly shoes
  const bl = f ? -1 : -2, fl = f ? 0 : 1;
  R('#f4f1ee', bl, -4); R(T.hat, bl, -3); R('#f4f1ee', fl, -4); R(T.hat, fl, -3);
  R('#5a3a1c', bl - 1, -2, 2, 1); R('#5a3a1c', fl, -2, 2, 1); R('#5a3a1c', fl + 2, -3);
  // tunic with zigzag hem, belt, buckle
  R(T.tunic, -2, -9, 5, 5);
  R(T.tunicD, -2, -5); R(T.tunicD, 0, -5); R(T.tunicD, 2, -5);
  R('#141214', -2, -7, 5, 1); R('#e8b45f', 0, -7);
  // back arm
  R(T.tunicD, -3, -9, 1, 3); R(e.skin, -3, -6);
  // front arm: punch / wind-up / normal
  if (punching) { R(T.tunic, 3, -8, 3, 1); R(e.skin, 6, -9, 1, 2); }
  else if (winding) { R(T.tunic, 3, -11, 1, 3); R('#ffffff', 3, -13, 2, 2); }
  else { R(T.tunicD, 3, -9, 1, 3); R(e.skin, 3, -6); }
  // head, ear, face
  R(e.skin, -2, -13, 5, 4);
  R(e.skin, 3, -12); R(e.skin, 4, -13);
  if (e.state === 'dazed') { R('#141214', 1, -12); R('#141214', 2, -11); R('#141214', 2, -12); R('#141214', 1, -11); }
  else { R('#141214', 1, -12); if (e.state === 'fight' || e.state === 'throw') R('#141214', 0, -13, 2, 1); }
  R('#ef8a9b', 2, -11);
  R(e.state === 'fly' ? '#141214' : '#8f3a3a', 1, -10);
  // floppy hat + pom
  R('#f4f1ee', -3, -14, 6, 1);
  R(T.hat, -2, -15, 4, 1); R(T.hat, -2, -16, 3, 1); R(T.hatD, -3, -17, 2, 1); R(T.hatD, -4, -17);
  R('#ffffff', -6, -18, 2, 2);
  x.restore();
  if (e.state === 'dazed') {
    for (let k = 0; k < 3; k++) {
      const a = e.t * .15 + k * 2.1;
      x.fillStyle = k % 2 ? '#f6d08f' : '#ffffff';
      x.fillRect(Math.round(e.x + Math.cos(a) * 5 * p), Math.round(e.y - 19 * p + Math.sin(a) * 1.5 * p), p, p);
    }
  }
}
function drawElves(){
  const x = sx;
  for (const e of elves.list) drawElf(e);
  for (const b of elves.balls) {
    x.fillStyle = '#ffffff'; x.beginPath(); x.arc(b.x, b.y, 3.2, 0, 6.283); x.fill();
    x.fillStyle = '#b9c8dc'; x.beginPath(); x.arc(b.x + 1, b.y + 1, 1.6, 0, 6.283); x.fill();
  }
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const p of elves.pops) {
    const k = p.life > 47 ? 1 + (p.life - 47) * .12 : 1;
    x.save(); x.globalAlpha = Math.min(1, p.life / 18); x.translate(p.x, p.y); x.rotate(p.rot); x.scale(k, k);
    x.font = '10px "Press Start 2P"'; x.lineWidth = 4; x.strokeStyle = '#141214'; x.strokeText(p.text, 0, 0);
    x.fillStyle = p.col; x.fillText(p.text, 0, 0); x.restore();
  }
}

addEventListener('resize', snowResize);
snowResize(); requestAnimationFrame(snowFrame);
</script>
